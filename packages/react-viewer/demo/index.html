<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@pdf-studio/react-viewer demo</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f6f8fc; color: #1f2a4c; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #dde3ee; }
      header h1 { font-size: 15px; margin: 0 12px 0 0; }
      .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
      .tabs button, .actions button { border: 1px solid #cfd7e6; background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-weight: 600; }
      .tabs button.active { background: #1a3581; border-color: #1a3581; color: #fff; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px; align-items: center; }
      .actions small { color: #7d879d; }
      main { height: calc(100vh - 110px); padding: 0 16px 16px; display: flex; gap: 12px; }
      .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; border: 1px solid #dde3ee; border-radius: 10px; overflow: hidden; background: #fff; }
      .pane h2 { margin: 0; padding: 8px 12px; font-size: 13px; border-bottom: 1px solid #dde3ee; }
      .pane .body { flex: 1; min-height: 0; }
      .side { width: 340px; display: flex; flex-direction: column; gap: 8px; }
      .side textarea { flex: 1; width: 100%; font: 11px/1.4 ui-monospace, Menlo, monospace; border: 1px solid #dde3ee; border-radius: 8px; padding: 8px; }
      .log { font-size: 12px; color: #7d879d; max-height: 120px; overflow: auto; }
      @media (max-width: 800px) { main { flex-direction: column; height: auto; } .pane { height: 70vh; flex: none; } .side { width: auto; height: 260px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
