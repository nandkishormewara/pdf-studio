# nginx site for PDF Studio: the web app at /, the processing server at /pdf-api/ (same origin, so no CORS needed).
# Installed by setup-server.sh as /etc/nginx/sites-available/pdf-studio. Replace SERVER_NAME, then add HTTPS
# (e.g. certbot --nginx -d SERVER_NAME) before real documents go through it.
server {
    listen 80;
    server_name SERVER_NAME;

    root /opt/pdf-studio/web;
    index index.html;

    # pdf.js worker is an .mjs file; some nginx versions don't know the type
    types { text/javascript mjs; }
    include /etc/nginx/mime.types;

    # hashed build files never change; index.html must always be fresh
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri /index.html; }

    # processing server (uploads up to the server's 100 MB limit; OCR can take minutes)
    location /pdf-api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 105m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        # Put authentication here before exposing beyond a test network, e.g.:
        # auth_basic "PDF Studio"; auth_basic_user_file /etc/nginx/pdf-studio.htpasswd;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
}
