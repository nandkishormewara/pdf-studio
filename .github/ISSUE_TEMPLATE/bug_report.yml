name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Web app, React viewer, iOS SDK, Android SDK, Server, Docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the attached PDF
        2. Add a highlight on page 2
        3. Export as XFDF
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: env
    attributes:
      label: Browser, OS or device
      placeholder: e.g. Chrome 140 on macOS, iPhone with iOS 26.5, Pixel 8 with Android 16
  - type: markdown
    attributes:
      value: |
        A small sample PDF or XFDF helps a lot. Please leave out personal or confidential data.
        Security problems go to the Security tab, not here (see SECURITY.md).
